<!doctype html><html lang="fr"><head><meta charset="utf-8">

<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Style « Sport premium » : fond clair, Inter Tight, en-tête et chrono dans la couleur du club, carte de changement bleu nuit. */
:root{
  --bg:#f3f5f8; --paper:#ffffff; --ink:#0b1426; --muted:#536176; --rule:#e2e7ee; --cardline:transparent; --navy:#0b1426;
  --turf:#0d5fa8; --turf2:#0a4f8d; --line:#ffffff;
  --def:#2563c9; --dm:#7a4fd0; --mid:#0f9a84; --att:#e0732a; --gk:#5d6873;
  --in:#12a05c; --out:#d6423a; --move:#7a4fd0; --warn:#f5a524; --warnInk:#4a2f00; --now:#12a05c;
  --chip:#e9edf3;
  /* Couleur principale (couleur du club) : réglée par app.js (applyColor) ; valeurs ici = bleu StickMate. */
  --club:#0d5fa8; --club2:#0a4f8d; --onclub:#fff; --onclub2:#fff; --clubink-l:#0d5fa8; --clubink-d:#7fb6ea; --clubink:var(--clubink-l); --clubink-n:#7fb6ea; --clubchip:rgba(255,255,255,.2);
  --display:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b141d; --paper:#132130; --ink:#e8f0f7; --muted:#97a9ba; --rule:#24384b;
  --turf:#0c4f8c; --turf2:#093f70; --chip:#1c3044; --warnInk:#2b1b00; --clubink:var(--clubink-d); --cardline:#24384b; --navy:#1c2f48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b141d; --paper:#132130; --ink:#e8f0f7; --muted:#97a9ba; --rule:#24384b;
  --turf:#0c4f8c; --turf2:#093f70; --chip:#1c3044; --warnInk:#2b1b00; --clubink:var(--clubink-d); --cardline:#24384b; --navy:#1c2f48; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--club)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--club);color:var(--onclub);overflow:hidden}
/* arc du cercle de tir, en filigrane */
.bar::after,.hero::after,.score-head::after{content:"";position:absolute;left:50%;bottom:-150px;width:240px;height:200px;transform:translateX(-50%);border:2px solid currentColor;border-radius:50%;opacity:.14;pointer-events:none}
.bar::after{right:-60px;left:auto;bottom:-170px;transform:none}
.bar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font:800 1.15rem/1.1 var(--display);letter-spacing:-.01em;margin-right:auto;position:relative;z-index:1}
.brand .logo{width:32px;height:32px;border-radius:9px;background:#0f1d33;display:grid;place-items:center;flex-shrink:0}
.brand .logo svg{width:27px;height:27px}
.brand .wm{font-size:1.3rem}
.wm{font-style:italic;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.wm-i{display:inline-block;width:.3em;height:.98em;vertical-align:-.2em;overflow:visible;transform:skewX(-10deg);margin:0 .01em}
.bar .wm-mate{opacity:.72}
.lockup{display:flex;align-items:center;gap:12px;font:800 2rem/1 var(--display);color:var(--ink)}
.lockup .logo{width:52px;height:52px;border-radius:13px;background:#0d5fa8;display:grid;place-items:center;flex-shrink:0}
.lockup .logo svg{width:44px;height:44px}
.lockup .wm-mate{color:var(--clubink)}
.bar-sub{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-end;text-align:right;font-size:.8rem;line-height:1.25;min-width:0;max-width:55%}
.bar-sub b{font-weight:700;font-size:.85rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-sub span{opacity:.85;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:center;background:var(--paper);border-top:1px solid var(--rule);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.tabbar button{flex:1;max-width:160px;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font:600 .8rem var(--body);position:relative}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:800}
.tabbar button[aria-current="page"]::after{content:"";width:18px;height:3px;border-radius:2px;background:var(--club)}
.onboard .tabbar,.adjoint .tabbar{display:none}
.adj-off #view button,.adj-off #view input{pointer-events:none;opacity:.4}
.qr{background:#fff;border-radius:12px;padding:8px;width:min(240px,70vw);margin:0 auto}.qr svg{display:block;width:100%;height:auto}
.pinf{-webkit-text-security:disc;text-security:disc;letter-spacing:.3em}
.onb{display:flex;flex-direction:column;gap:14px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.92rem}
.fld input{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--bg);font-weight:600;font-size:1rem}
.code{font:italic 800 3.2rem/1 var(--display);letter-spacing:.25em;text-align:center;background:var(--chip);border-radius:14px;padding:16px 0 16px .25em}
.mbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px}
.mlist2{display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:4px 6px 4px 4px;border:2px solid transparent}
.mrow.cur{border-color:var(--club)}
.mopen{flex:1;min-width:0;border:0;background:none;text-align:left;display:flex;flex-direction:column;padding:8px 10px;color:inherit}
.mopen span{font-size:.88rem}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
.startl{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.startl li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--rule)}
.startl .sk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--rule);display:grid;place-items:center;font-weight:800;font-size:.8rem}
.startl li.dn .sk{background:#2fbf71;border-color:#2fbf71;color:#fff}
.startl .st{flex:1;min-width:0;display:flex;flex-direction:column}
.startl .st .muted{font-size:.85rem}
.startl li.dn .st b{color:var(--muted);text-decoration:line-through}
.set{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;padding:10px 0;border-top:1px solid var(--rule)}
.set:first-of-type{border-top:0}
.set .muted{font-size:.88rem}
.seg{display:flex;flex-wrap:wrap;background:var(--chip);border-radius:10px;padding:3px;flex-shrink:1;min-width:0}
.seg button{border:0;background:none;border-radius:8px;padding:6px 10px;font:700 .9rem var(--body);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tabs{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;color:#fff;font:700 1rem var(--body);padding:7px 16px;border-radius:999px}
.tabs button[aria-pressed="true"]{background:#fff;color:var(--turf2)}
main{max-width:1100px;margin:0 auto;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--paper);border:1px solid var(--cardline);border-radius:20px;padding:16px;min-width:0;box-shadow:0 1px 2px rgba(11,20,38,.05)}
h2{font:800 1.15rem/1.15 var(--display);letter-spacing:-.01em;margin:0 0 12px;color:var(--ink)}
.muted{color:var(--muted)}
.priv summary{cursor:pointer;color:var(--muted);font-size:.85rem;text-decoration:underline}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:14px;padding:11px 16px;font:700 1rem var(--body);background:var(--chip);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--club);color:var(--onclub)}
.btn.go{background:var(--in);color:#fff}
.btn.danger{background:var(--out);color:#fff}
.btn.big{font-size:1.1rem;font-weight:800;padding:16px 22px;border-radius:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* match grid */
.match{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:14px;align-items:start}
@media (max-width:860px){.match{grid-template-columns:1fr}}
.clock{display:flex;flex-direction:column;gap:12px}
.clock-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.qbadge{font:800 1.1rem var(--display);background:var(--club);color:var(--onclub);border-radius:8px;padding:4px 10px}
.time{font:italic 800 clamp(4.2rem,19vw,6.5rem)/.9 var(--display);letter-spacing:-.04em}
.time.paused{color:var(--muted)}
.remain{font:600 1rem var(--body);color:var(--muted)}
.card.clock{padding:0;gap:0;overflow:hidden}
.score-head{margin:0;padding:16px 16px 16px;border-radius:0;background:var(--club);color:var(--onclub);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.score-head>*{position:relative;z-index:1}
.score-head .qbadge{background:var(--clubchip);color:inherit}
.score-head .remain{color:inherit;opacity:.85}
.score-head .time.paused{color:inherit;opacity:.7}
.score-head .prog{background:var(--clubchip)}
.score-head .prog i{background:var(--onclub)}
.score-head .clock-top{justify-content:flex-start}
.score-head .live{color:inherit;font-weight:800;font-size:.85rem;letter-spacing:0;text-transform:none}
.tools-btn{margin-left:auto;border:0;border-radius:8px;padding:5px 10px;background:var(--clubchip);color:inherit;font:700 .85rem var(--body)}
.tools-btn[aria-expanded="true"]{background:var(--onclub);color:var(--club)}
.sh-ctrl{display:grid;grid-template-columns:72px minmax(0,1fr) 72px;gap:8px;align-items:stretch}
.sh-ctrl .btn{background:var(--clubchip);color:inherit;padding:12px 4px}
.sh-ctrl .btn.big{background:var(--onclub);color:var(--club);font-size:1.1rem}
.sh-ctrl .alert-title{display:grid;place-items:center}
.tools{display:flex;flex-direction:column;gap:10px;padding:14px 16px 16px}
.tools-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tools-t{font-size:.85rem;margin-top:2px}
.tools .nav{border-top:0;padding-top:0}
.actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.actions .btn{background:var(--paper);border:1px solid var(--cardline)}
.actions .btn.warnb{background:#ffe8b8;color:#5a3a00;border-color:transparent}
.mcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.seg-full{display:flex}.seg-full button{flex:1;padding:8px 4px}
.sh-title{font-weight:700;font-size:.95rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.sh-score{font:800 1.9rem/1 var(--display);padding-bottom:6px}
.prog{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;position:relative}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--club);border-radius:99px}
.prog b{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--warn);border-radius:2px}
/* carte du prochain changement (bleu nuit, toujours bien visible) */
.alert{border-radius:20px;padding:18px;background:var(--navy);color:#fff;display:flex;flex-direction:column;gap:14px}
.alert.calm{background:var(--paper);color:var(--ink);border:1px solid var(--cardline)}
.alert.soon{box-shadow:0 0 0 4px var(--warn)}
.alert.now{background:#0b7d46}
@media (prefers-reduced-motion:no-preference){.alert.soon{animation:pulse 1s ease-in-out infinite}}
@keyframes pulse{50%{transform:scale(1.012)}}
.alert-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.alert-title{font:700 .85rem var(--display);text-transform:uppercase;letter-spacing:.08em}
.alert-when{font-weight:600;opacity:.8;font-size:.95rem}
.count{font:italic 800 2.4rem/1 var(--display);color:var(--clubink-n)}
.alert.soon .count{color:var(--warn)}
.alert.now .count{color:#fff}
.moves{display:flex;flex-direction:column}
.tag{font:800 .85rem var(--display);text-transform:uppercase;letter-spacing:.06em;border-radius:6px;padding:2px 8px;color:#fff;text-align:center;min-width:64px}
.tag.in{background:var(--in)}.tag.out{background:var(--out)}.tag.mvv{background:var(--move)}
.pos{display:inline-block;font:800 .9rem var(--display);border-radius:6px;padding:0 7px;color:#fff;margin-left:6px;vertical-align:2px}
.pos.def{background:var(--def)}.pos.dm{background:var(--dm)}.pos.mid{background:var(--mid)}.pos.att{background:var(--att)}.pos.gk{background:var(--gk)}
.swap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;align-items:center;padding:14px 0;border-top:1px solid rgba(255,255,255,.16)}
.swap:first-child{border-top:0;padding-top:0}
.s-names{display:flex;flex-direction:column;gap:8px;min-width:0}
.s-row{display:flex;align-items:center;gap:10px;min-width:0}
.mk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#0b1426;flex-shrink:0}
.mk.in{background:#2fbf71}.mk.out{background:#ff6b5e}.mk.mv{background:#f5a524}
.s-mv .mvt{font-size:1.1rem;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mini.mv circle.in{fill:#2fbf71;stroke:none}
.alert.now .mk{background:#fff}.alert.now .mk.in{color:#0b7d46}.alert.now .mk.out{color:#c62f2f}
.s-in .big{font:800 clamp(1.5rem,7.5vw,2.2rem)/1.05 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
.s-out .big{font:500 clamp(1.15rem,5.6vw,1.6rem)/1.05 var(--display);opacity:.8;overflow-wrap:anywhere}
.mini{width:56px;height:80px;flex-shrink:0}
.mini g{fill:none;stroke:currentColor;stroke-opacity:.5;stroke-width:1.4}
.mini circle{fill:var(--clubink-n)}
.alert.now .mini circle{fill:#fff}
.where{grid-column:1/-1;font-size:1rem;font-weight:600;padding-top:10px;border-top:1px solid rgba(255,255,255,.16)}
.where .note{color:inherit;opacity:.75;font-weight:500}
.note{color:var(--muted);font-size:.9rem}
.reorg{background:rgba(255,255,255,.1);color:inherit;border-radius:14px;padding:10px 12px;margin-top:6px;display:flex;gap:12px;align-items:center}
.reorg-x{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.rl-h{font-weight:700}.rl-d{padding-left:22px;font-size:.95rem}
.mini.mv .ar{stroke:var(--clubink-n);stroke-width:2.2}.mini.mv .ah{fill:var(--clubink-n)}.mini.mv circle{fill:none;stroke:currentColor;stroke-width:1.4}
.alert.now .mini.mv .ar{stroke:#fff}.alert.now .mini.mv .ah{fill:#fff}
.reorg-t{font:800 .8rem var(--display);text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.reorg-l{font-size:1.05rem}
.reorg .note{color:inherit;opacity:.75}
.up-l div{margin:2px 0}
.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding-top:10px;border-top:1px solid var(--rule)}
.nav .btn{font-size:.9rem;padding:10px 6px}
.banner{border-radius:12px;padding:12px 14px;font-size:1.05rem;color:#fff}
.banner.vert{background:#178a3c}.banner.jaune,.banner.jaune10{background:#e9b10d;color:#3b2a00}.banner.rouge{background:#c62f2f}.banner.bless{background:#5a6b7b}
.btn.warnb{background:#ffe8b8;color:#5a3a00}
.live{font:700 .8rem var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--in)}
.incp{border:2px solid var(--warn)}
.inc-types,.inc-players{display:flex;flex-wrap:wrap;gap:6px}
.inc-t[aria-pressed="true"],.inc-players .btn[aria-pressed="true"]{background:var(--club);color:var(--onclub)}
.mlist{display:flex;flex-wrap:wrap;gap:6px}
.rate-b{border:0;background:var(--paper);color:var(--ink);border-radius:999px;padding:3px 9px;margin-right:8px;font:inherit;font-weight:700;font-size:.82rem;cursor:pointer}
.rate-b[aria-pressed=true]{background:var(--club);color:var(--onclub)}
.minrow select{border:1px solid var(--rule);border-radius:8px;padding:5px 6px;background:var(--paper);color:var(--ink)}
.cardn{display:inline-block;min-width:16px;padding:0 3px;margin-right:3px;border-radius:3px;font-size:.78rem;font-weight:800;text-align:center;color:#fff}
.cardn.g{background:#2e9e5b}.cardn.y{background:#e3b505;color:#3a2f00}.cardn.r{background:#d0453a}
.gk-tag{font-size:.7rem;font-weight:800;background:var(--club);color:var(--onclub);border-radius:4px;padding:1px 4px;margin-right:5px;vertical-align:1px}
.mchip{background:var(--chip);border-radius:999px;padding:2px 4px 2px 12px;font-size:.88rem;display:inline-flex;align-items:center}
.far{display:flex;flex-direction:column;gap:18px}
.far-top{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.far .time{font-size:clamp(5rem,18vw,14rem)}
.far .qbadge{font-size:clamp(1.6rem,4vw,3rem)}
.far .remain{font-size:clamp(1rem,2.4vw,1.6rem)}
.far .alert-title{font-size:clamp(1.4rem,3vw,2.4rem)}
.far .count{font-size:clamp(2.6rem,7vw,6rem)}
.far .s-in .big{font-size:clamp(2.4rem,7vw,5.5rem)}.far .s-out .big{font-size:clamp(1.8rem,5vw,4rem)}.far .mini{width:90px;height:128px}.far .mk{width:48px;height:48px;font-size:1.5rem}
.far .where,.far .reorg-l{font-size:clamp(1.1rem,2.4vw,1.8rem)}
.far .pos{font-size:clamp(1rem,2.4vw,1.8rem);padding:0 10px}
.far .banner{font-size:clamp(1.1rem,2.4vw,1.8rem)}
.btn.small{font-size:.85rem;padding:7px 10px}
.sheet{padding:12px 14px}
.sheet-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.score{display:flex;flex-direction:column;align-items:center;line-height:1}
.score span{font:italic 800 2.2rem var(--display)}.score small{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dash{font:800 1.6rem var(--display);color:var(--muted)}
.sheet-btns{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.roles{display:flex;gap:3px}
.role{border:1px solid var(--rule);background:var(--bg);color:var(--muted);border-radius:6px;font:700 .8rem var(--display);width:26px;height:26px;padding:0}
.role.on{background:var(--att);border-color:var(--att);color:#fff}
.rl{font-style:normal;background:#fff;color:#0f1d2b;border-radius:4px;padding:0 3px;margin-left:3px;font-size:.75em}
.btn.dim{opacity:.6}
.posed{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:180px}
.pchip{border:0;border-radius:6px;color:#fff;font:700 .78rem var(--display);padding:3px 6px;letter-spacing:.02em}
.pchip.def{background:var(--def)}.pchip.dm{background:var(--dm)}.pchip.mid{background:var(--mid)}.pchip.att{background:var(--att)}.pchip.gk{background:var(--gk)}
.posed select{width:auto;min-width:0;font-size:.8rem;padding:3px 4px}
/* pitch */
.pitch{position:relative;aspect-ratio:3/4.4;max-width:100%;background:repeating-linear-gradient(180deg,var(--turf) 0 12.5%,var(--turf2) 12.5% 25%);border-radius:14px;overflow:hidden}
.pitch .l{position:absolute;border:2px solid rgba(255,255,255,.55)}
.pp{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:31%}
.pp .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:800 .82rem var(--display);color:#fff;border:2px solid #fff}
.pp .nm{font:700 clamp(.78rem,2.6vw,.95rem)/1.1 var(--display);background:rgba(0,0,0,.45);color:#fff;border-radius:6px;padding:2px 6px;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp.chg .nm{background:var(--warn);color:var(--warnInk)}
.pp select{max-width:100%;font:600 .85rem var(--body);border-radius:6px;border:0;padding:3px 4px;background:#fff;color:#0f1d2b}
.dot.def{background:var(--def)}.dot.dm{background:var(--dm)}.dot.mid{background:var(--mid)}.dot.att{background:var(--att)}.dot.gk{background:var(--gk)}
/* upcoming */
.up{display:flex;flex-direction:column;gap:0}
.up-item{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--rule);font-size:.95rem}
.up-item:first-child{border-top:0}
.up-item.done{opacity:.4}
.up-t{font:800 1.05rem var(--display)}
.up-l span{display:inline-block;margin-right:10px}
.i{color:var(--in);font-weight:700}.o{color:var(--out)}.m{color:var(--move);font-size:.88rem}
.bench{display:flex;flex-wrap:wrap;gap:6px}
.bench span{background:var(--chip);border-radius:999px;padding:3px 10px;font-weight:600;font-size:.9rem}
/* coach */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font:700 .72rem var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:5px 6px;border-bottom:1px solid var(--rule);vertical-align:middle}
td input[type=text],td input[type=number],td select{width:100%;min-width:56px;border:1px solid var(--rule);border-radius:8px;padding:6px 8px;background:var(--bg)}
td input.name{min-width:120px;font-weight:600}
tr.absent td:not(:first-child){opacity:.45}
.x{border:0;background:none;color:var(--muted);font-size:1.2rem;padding:4px 8px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.rules label{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border-radius:10px;padding:8px 10px;font-size:.92rem}
.rules input{width:70px;border:1px solid var(--rule);border-radius:8px;padding:5px 6px;background:var(--paper);text-align:right}
.warn{background:#fff4dc;color:#5a3a00;border-radius:10px;padding:10px 12px;font-size:.92rem}
:root:not([data-theme="light"]) .warn{}
.ok{background:#dff5e8;color:#0b5a32;border-radius:10px;padding:10px 12px;font-size:.92rem}
.recap td,.recap th{font-size:.9rem}
.dev{font:700 .95rem var(--display)}
.tl{overflow-x:auto}.tl-in{min-width:640px;display:flex;flex-direction:column;gap:3px}
.tlr{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;font-size:.82rem}
.trk{position:relative;height:18px;background:var(--bg);border-radius:4px}
.trk i{position:absolute;top:0;bottom:0;border-radius:3px;color:#fff;font:700 .72rem/18px var(--display);text-align:center;font-style:normal;overflow:hidden}
.trk .q{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.3}
.pin{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 16px;text-align:center}
.pin input{font:800 2rem var(--display);width:200px;text-align:center;letter-spacing:.4em;border:2px solid var(--rule);border-radius:12px;padding:8px;background:var(--paper)}
.save{font-size:.82rem;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid var(--rule);padding:0;display:grid;place-items:center;font:800 1.1rem var(--display)}
.sw[aria-pressed="true"],.sw[data-on="true"]{outline:3px solid var(--ink);outline-offset:2px}
.sw.other{position:relative;overflow:hidden;background:conic-gradient(#c8102e,#f2c200,#0b7a43,#0d5fa8,#5b2d8e,#c8102e)}
.sw.other input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.clubprev{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.empty{padding:30px 10px;text-align:center}
/* onglets en haut de page */
.seg-top{border-radius:12px}.seg-top button{font-size:.95rem;padding:9px 4px;border-radius:10px}
/* Coach : préparation du match en étapes */
.prep-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 4px}
.prep-t{font:italic 800 clamp(1.5rem,7vw,2rem)/1.05 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
.steps-card{padding:4px 16px}
.step+.step{border-top:1px solid var(--rule)}
.step-h{width:100%;display:flex;align-items:center;gap:12px;padding:13px 0;border:0;background:none;text-align:left;color:inherit}
.step-n{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:800;background:var(--chip)}
.step-n.ok{background:#2fbf71;color:#0b1426}
.step-t{flex:1;min-width:0;display:flex;flex-direction:column}
.step-t b{font-size:1.02rem}
.step-t span{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step-c{color:var(--muted);font-size:1.2rem}
.step-b{padding:2px 0 16px}
.chks{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:7px 12px 7px 10px;font-weight:600;font-size:.92rem;color:var(--muted)}
.chk.on{background:var(--club);color:var(--onclub)}
.chk input{margin:0;accent-color:var(--onclub)}
.budget{margin-bottom:10px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1.5px solid var(--rule)}
.budget-big{font-weight:800;font-size:1.05rem}
.budget-bar{height:8px;border-radius:4px;background:var(--rule);margin:7px 0 6px;overflow:hidden}
.budget-bar i{display:block;height:100%;background:var(--club);transition:width .2s}
.budget-sub{font-size:.85rem;color:var(--muted)}
.budget.ok{border-color:#2e9e5b}.budget.ok .budget-big{color:#2e9e5b}.budget.ok .budget-bar i{background:#2e9e5b}
.budget.over{border-color:#d0453a}.budget.over .budget-big{color:#d0453a}.budget.over .budget-bar i{background:#d0453a}
.mins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.mlist{display:flex;flex-direction:column;margin-top:8px}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--rule)}
.mrow:first-child{border-top:0}
.mrow .mt{min-width:64px;font:800 1.05rem var(--display)}
.mrow .mw{flex:1;min-width:0}.mrow .i span,.mrow .o span{display:inline-block;white-space:nowrap;margin-right:12px}.mrow .i{color:var(--in);font-weight:700}.mrow .o{color:var(--out)}
.mrow.bad{opacity:.7}.mrow.bad .mt{color:var(--warn)}
.mwiz{margin-top:12px;border:2px solid var(--club);border-radius:14px;padding:12px 14px}
.mwiz-t{font:800 .8rem var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--clubink);margin-bottom:6px}
.mstep{padding-top:10px}.mstep + .mstep{border-top:1px solid var(--rule);margin-top:10px}
.msel select{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--bg);font-weight:700;min-height:44px}
#mEnd[aria-pressed="true"],.inc-players .btn[aria-pressed="true"]{background:var(--club);color:var(--onclub)}
.mdet{margin-top:14px;border-top:1px solid var(--rule);padding-top:10px}
.mdet summary{font-weight:700;cursor:pointer;min-height:32px}
.minrow b{font-weight:700}
.minrow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:6px 8px 6px 10px;font-size:.92rem;font-weight:600}
.minrow span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.minrow input{width:64px;border:1px solid var(--rule);border-radius:8px;padding:5px 6px;background:var(--paper);text-align:right}
/* Réglages : groupes */
.grp-t{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 4px -8px}
.grp{padding:2px 16px}
.grp .set{padding:13px 0}
.grp>.set:first-child,.grp>.set-x:first-child{border-top:0}
.set-x{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border:0;border-top:1px solid var(--rule);background:none;color:inherit;font-weight:700;font-size:1rem;text-align:left}
.set-v{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600}
.dotc{width:20px;height:20px;border-radius:50%;border:1px solid var(--rule)}
.xp{padding:0 0 16px}
.xp .card{background:none;border:0;box-shadow:none;padding:0;border-radius:0}
.xp .card+.card{margin-top:16px;padding-top:16px;border-top:1px solid var(--rule);border-radius:0}
.xp .card>h2{font-size:1rem;margin-bottom:8px}
.set-num{width:76px;border:1px solid var(--rule);border-radius:10px;padding:8px;background:var(--bg);text-align:right;font-weight:700;flex-shrink:0}
/* Règles de rotation : frise du match, quarts différents, chiffres avec unité */
.rnum{display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
.rnum small{color:var(--muted);font-weight:600}
.rline{display:flex;gap:8px;flex-wrap:wrap}
.rline label{display:grid;gap:3px;font-size:.78rem;font-weight:600;color:var(--muted)}
.rline .set-num{width:70px}
.frise{background:var(--paper);border-radius:14px;padding:6px 14px 10px;margin-bottom:14px;border:1px solid var(--cardline)}
.fz{display:grid;gap:5px;padding:9px 0}
.fz-h{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}
.fz-h b{font-weight:800;font-style:italic}
.fz-h span{color:var(--muted)}
.fz.diff .fz-h b{color:var(--clubink)}
.fz-t{position:relative;height:14px;border-radius:7px;background:var(--chip);overflow:hidden}
.fz-t i{position:absolute;top:0;bottom:0;background:var(--in);border-radius:7px}
.fz-tags{display:flex;gap:5px;flex-wrap:wrap}
.fz-tags span{font-size:.74rem;background:var(--chip);border-radius:99px;padding:2px 8px;color:var(--muted)}
.fz-brk{font-size:.74rem;color:var(--muted);display:flex;align-items:center;gap:6px;padding-top:2px}
.fz-brk::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rule)}
.fz-brk.on::before{background:var(--in)}
.perq{display:grid;gap:8px}
.pchip-q{border:1.5px solid var(--rule);background:var(--paper);border-radius:12px;padding:8px 4px;font:800 1rem var(--display);font-style:italic;display:grid;gap:2px}
.pchip-q small{font:600 .72rem var(--body);font-style:normal;color:var(--muted)}
.pchip-q.diff small{color:var(--clubink);font-weight:700}
.pchip-q.base{font-style:normal;font-size:.92rem}
.per-ed .set>div:first-child,.rules-all .set>div:first-child{flex:1 1 170px;min-width:0}
.pchip-q[aria-pressed="true"]{background:var(--club);border-color:var(--club);color:var(--onclub)}
.pchip-q[aria-pressed="true"] small{color:var(--onclub)}
.per-ed{margin-top:12px;border-top:1px solid var(--rule);padding-top:12px}
.per-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.pdiff{font-size:.78rem;font-weight:700;color:var(--clubink)}
.set.own b{color:var(--clubink)}
/* accueil */
.hero{background:var(--club);color:var(--onclub);border-radius:20px;padding:20px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.hero>*{position:relative;z-index:1}
.hero-k{font-size:.85rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.hero-t{font:italic 800 clamp(2rem,9.5vw,2.8rem)/1 var(--display);letter-spacing:-.03em;overflow-wrap:anywhere}
.hero-s{font-weight:600;opacity:.9;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--paper);border:1px solid var(--cardline);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font:800 clamp(1.15rem,5.6vw,1.6rem)/1.2 var(--display);white-space:nowrap}
.tile span{font-size:.82rem;color:var(--muted)}
</style>
